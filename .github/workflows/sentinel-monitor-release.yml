name: SENTINEL Monitor Release Evidence

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["sentinel-monitor-go/v*.*.*"]
    paths:
      - "sentinel-monitor-go/**"
      - ".github/workflows/sentinel-monitor-release.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "sentinel-monitor-go/**"
      - ".github/workflows/sentinel-monitor-release.yml"
  schedule:
    - cron: "35 4 * * 1"

permissions:
  contents: read

concurrency:
  group: sentinel-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sentinel-monitor-go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: sentinel-monitor-go/go.mod
          cache: false
      - name: Format, test, vet and build
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          go test ./...
          go vet ./...
          go build -trimpath -o "$RUNNER_TEMP/sentinel-monitor" ./cmd/sentinel-monitor
      - name: Check Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
      - name: Test release evidence rejection paths
        run: python3 -m unittest discover -s scripts -p 'test_release_evidence.py'

  build-and-scan:
    needs: validate-monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      evidence_sha256: ${{ steps.seal.outputs.evidence_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build an offline OCI archive with attestations
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: sentinel-monitor-go
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Validate OCI graph and bind the platform image
        id: prepare
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 sentinel-monitor-go/scripts/release_evidence.py prepare \
            --archive "$RUNNER_TEMP/image.tar" --digest "$IMAGE_DIGEST" \
            --commit "$GITHUB_SHA" --layout "$RUNNER_TEMP/oci" \
            --evidence "$RUNNER_TEMP/release-evidence.json"
      - name: Scan the exact platform image before any registry write
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.75.0
          scan-type: image
          input: ${{ runner.temp }}/oci
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/trivy-report.json
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          cache: false
        env:
          TRIVY_IGNOREFILE: /dev/null
      - name: Seal successful scan evidence
        id: seal
        run: |
          python3 sentinel-monitor-go/scripts/release_evidence.py seal \
            --archive "$RUNNER_TEMP/image.tar" \
            --evidence "$RUNNER_TEMP/release-evidence.json" \
            --report "$RUNNER_TEMP/trivy-report.json"
      - name: Check whether a scan report was produced
        id: scan_report
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/trivy-report.json" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain vulnerability report, including failed scans
        if: ${{ always() && steps.scan_report.outputs.available == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sentinel-monitor-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain the exact validated OCI archive and evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sentinel-monitor-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/release-evidence.json
            ${{ runner.temp }}/trivy-report.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [validate-monitor, build-and-scan]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sentinel-monitor-go/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sentinel-monitor-go
      IMAGE_DIGEST: ${{ needs.build-and-scan.outputs.image_digest }}
      EVIDENCE_SHA256: ${{ needs.build-and-scan.outputs.evidence_sha256 }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and ancestry
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^sentinel-monitor-go/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "VERSION_TAG=${GITHUB_REF_NAME#sentinel-monitor-go/}" >> "$GITHUB_ENV"
      - name: Download artifact from this successful build-and-scan job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build-and-scan.outputs.artifact_id }}
          path: ${{ runner.temp }}/validated
          merge-multiple: true
      - name: Reject changed artifacts, scan reports or stale evidence
        run: |
          python3 sentinel-monitor-go/scripts/release_evidence.py verify \
            --archive "$RUNNER_TEMP/validated/image.tar" \
            --evidence "$RUNNER_TEMP/validated/release-evidence.json" \
            --report "$RUNNER_TEMP/validated/trivy-report.json" \
            --expected-evidence-sha "$EVIDENCE_SHA256"
      - name: Install promotion tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          skopeo --version
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the validated archive with its original digest and attestations
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests \
            --digestfile "$RUNNER_TEMP/published-digest.txt" \
            "oci-archive:$RUNNER_TEMP/validated/image.tar" \
            "docker://$IMAGE_NAME:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(cat "$RUNNER_TEMP/published-digest.txt")" = "$IMAGE_DIGEST"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Sign and verify the published digest
        run: |
          set -euo pipefail
          cosign sign --yes --bundle "$RUNNER_TEMP/validated/cosign-bundle.json" "$IMAGE_NAME@$IMAGE_DIGEST"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/sentinel-monitor-release.yml@$GITHUB_REF"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_NAME@$IMAGE_DIGEST" > "$RUNNER_TEMP/validated/cosign-verification.json"
      - name: Retain signed candidate evidence before promoting release aliases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sentinel-monitor-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/validated/release-evidence.json
            ${{ runner.temp }}/validated/trivy-report.json
            ${{ runner.temp }}/validated/cosign-bundle.json
            ${{ runner.temp }}/validated/cosign-verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Promote signed digest to version and commit aliases
        run: |
          set -euo pipefail
          for tag in "$VERSION_TAG" "sha-$GITHUB_SHA"; do
            skopeo copy --all --preserve-digests \
              --digestfile "$RUNNER_TEMP/alias-digest.txt" \
              "docker://$IMAGE_NAME@$IMAGE_DIGEST" "docker://$IMAGE_NAME:$tag"
            test "$(cat "$RUNNER_TEMP/alias-digest.txt")" = "$IMAGE_DIGEST"
          done
      - name: Release evidence summary
        run: |
          {
            echo "## SENTINEL Monitor Release Evidence"
            echo "- Commit: $GITHUB_SHA"
            echo "- Image: $IMAGE_NAME@$IMAGE_DIGEST"
            echo "- Version: $VERSION_TAG"
            echo "- Scan: HIGH/CRITICAL gate passed before registry write"
            echo "- SBOM and provenance: verified in the promoted OCI index"
            echo "- Signature: keyless Cosign verification passed"
          } >> "$GITHUB_STEP_SUMMARY"
